<header class="header">

    <div class="syahir-photo animate__fadeInDown animate__animated animate__faster">
        <!-- <img src="../../assets/syahir.JPG" alt="sg-photo" height="100%"> -->
        <img [src]="'data:image/png;base64,' + photo.encodeImg" height="100%" alt="syahir-ghariff" *ngIf="photo.encodeImg">
    </div>


    <div class="syahir-title ">
        <div class="syahir-title__name animate__fadeInDown animate__animated animate__faster"> {{name.name}} </div>
        <div class="border-line"></div>

        <div class="syahir-title__job animate__fadeInDown animate__animated animate__faster">
            <span *ngFor="let detail of details; index as i">
                <svg class="syahir-title__icon"> <use [attr.xlink:href]="constants.SVG_PATH+detail.svg"></use></svg> 
                {{detail.name}}
            </span>
        </div>
    </div>


    <div class="simple-wallpaper"></div>
</header>
