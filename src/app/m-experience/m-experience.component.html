<div class="m-base">
    <div *ngIf="!showDetail">
        <div class="m-list animate__animated animate__fadeInUp animate__faster" *ngFor="let job of jobs; index as i">

            <!-- Experience Photo  -->
            <div class="form-group" style="margin-top: 20px;">
                <span class="label"> Picture </span>

                <br *ngIf="!job.encodeImg" />

                <div class="job-photo" *ngIf="job.encodeImg">
                    <!-- <img [src]="'data:image/png;base64,' + job.encodeImg" height="100%" /> -->
                    <img [src]="'data:image/png;base64,' + job.encodeImg" />
                </div>

                <label class="upload-photo" for="{{'job-photo' + i}}">
                    <svg class="upload-photo__icon"><use xlink:href="../../assets/sprite.svg#icon-image"></use></svg><span> Upload Photo </span>
                </label>

                <input type="file" accept="image/*" id="{{'job-photo' + i}}" class="file-photo" (change)="onUploadImage($event, i)" />
            </div>

            <!-- Company Name  -->
            <div class="form-field form-group">
                <mat-form-field appearance="outline">
                    <mat-label> Company Name </mat-label>
                    <input [(ngModel)]="job.companyName" matInput />
                </mat-form-field>
            </div>

            <!-- Job Title   -->
            <div class="form-field">
                <mat-form-field appearance="outline">
                    <mat-label> Job Title </mat-label>
                    <input [(ngModel)]="job.title" matInput />
                </mat-form-field>
            </div>

            <!-- Year -->
            <div class="form-field">
                <mat-form-field appearance="outline">
                    <mat-label>Year </mat-label>
                    <input [(ngModel)]="job.year" matInput />
                </mat-form-field>
            </div>

            <div class="btn-status-delete">
                <div class="slide-toggle">
                    <mat-slide-toggle [checked]="job.active === 'A'" (change)="setToggle(i, $event)"></mat-slide-toggle>
                </div>

                <div class="delete" (click)="onDelete(job, i)">
                    <svg class="delete__icon"><use xlink:href="../../assets/sprite.svg#icon-clear"></use></svg>
                </div>

                <div class="general-btn" style="margin-left: 20px;" (click)="onEditDetail(job, i)">
                    <span> Include Details </span>
                    <svg class="general-btn__icon">
                        <use xlink:href="../../assets/sprite.svg#icon-chevrons-right"></use>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Add Details Button  -->
        <div class="add-more" (click)="onAddJobs()" style="margin-top: 10px;">
            <svg class="add-more__icon"><use xlink:href="../../assets/sprite.svg#icon-plus-circle"></use></svg> <span> Add Experience </span>
        </div>
    </div>

    <app-m-experience-detail [job]="job" (showDetail)="onBack($event)" *ngIf="showDetail"></app-m-experience-detail>

    <!-- Submit button  -->
    <div class="submit-button" *ngIf="!showDetail">
        <button (click)="onSubmit()">Update</button>
    </div>
</div>
