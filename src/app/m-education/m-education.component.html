<div class="education">

    <div *ngFor="let education of educations; index as i" class="edu-list">

        <!-- Education Photo  -->
        <div class="form-group" style="margin-top: 20px;">
            <span class="label"> 
                Picture
            </span>

            <br *ngIf="!education.encodeImg" />
            <div class="edu-photo" *ngIf="education.encodeImg">
                <img [src]="'data:image/png;base64,' + education.encodeImg" height="100%">
            </div>

            <label class="upload-photo" for="{{'edu-photo' + i}}">
                <svg class="upload-photo__icon"> <use xlink:href="../../assets/sprite.svg#icon-image"></use></svg><span> Upload Photo </span>
            </label>

            <input type="file" accept="image/*" id="{{'edu-photo' + i}}" class="file-photo" (change)="onUploadImage($event, i)">

        </div>


        <!-- Education Name  -->
        <div class="form-group ">
            <span class="label "> 
                Name
            </span>
            <div class="form-group__input ">
                <input type="text" [(ngModel)]="education.name">
            </div>
        </div>

        <!-- Course  -->
        <div class="form-group ">
            <span class="label "> 
                Course
            </span>
            <div class="form-group__input ">
                <input type="text" [(ngModel)]="education.course">
            </div>
        </div>

        <!-- Year -->
        <div class="form-group ">
            <span class="label "> 
                Year
            </span>
            <div class="form-group__input ">
                <input type="text" [(ngModel)]="education.year">
            </div>
        </div>


        <div class="btn-status-delete">
            <select [(ngModel)]="education.active" [ngClass]="{'option-active' : education.active === 'A', 'option-inactive' : education.active === 'X'}"> 
            <option value="" selected disabled> Status </option> 
            <option value="A"> Active </option>
             <option value="X"> Inactive </option>
        </select>

            <div class="delete" (click)="onDelete(education, i)">
                <svg class="delete__icon"><use xlink:href="../../assets/sprite.svg#icon-clear"></use></svg>
            </div>
        </div>
    </div>

    <!-- Add Details Button  -->
    <div class="add-more" (click)="onAddEducation()" style="margin-top: 10px;">
        <svg class="add-more__icon"> <use xlink:href="../../assets/sprite.svg#icon-plus-circle"></use></svg> <span> Add Education </span>
    </div>


    <!-- Submit button  -->
    <div class="submit-button">
        <button (click)="onSubmit()"> Update </button>
    </div>

</div>
